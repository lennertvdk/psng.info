description:
  de: Zirkuläres Breathwork kann veränderte Bewusstseinszustände auslösen, ähnlich wie Psychedelika. Jelena Brasanac stellt eine der ersten Studien vor, die dabei Körper und Erleben gemeinsam gemessen hat, und gibt einen Ausblick auf die Folgestudien RESET und BIOBREATH.
  en: Circular breathwork can trigger altered states of consciousness similar to those reported with psychedelics. Jelena Brasanac presents one of the first studies to measure body and experience together during a session, plus an outlook on the follow-up studies RESET and BIOBREATH.
