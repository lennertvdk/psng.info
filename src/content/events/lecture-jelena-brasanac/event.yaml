speakerBio:
  de: Jelena Brasanac ist translationale Neurowissenschaftlerin an der Charité – Universitätsmedizin Berlin und forscht an der Schnittstelle von biologischer Psychiatrie und Immunpsychiatrie. Sie ist Mitautorin einer der ersten Studien zu den physiologischen Mechanismen hinter veränderten Bewusstseinszuständen durch Breathwork und leitet heute BIOBREATH, eine Studie zu den Effekten von zirkulärem Breathwork auf Entzündungs- und immunmetabolische Marker.
  en: Dr Jelena Brasanac is a translational neuroscience researcher at Charité – Universitätsmedizin Berlin, working at the intersection of biological psychiatry and immunopsychiatry. She co-authored one of the first studies investigating the physiological mechanisms underlying breathwork-induced altered states of consciousness, and now leads BIOBREATH, a study examining the effects of circular breathwork on inflammatory and immunometabolic markers.
abstract:
  lang: en
  title: "Breathing into altered states: what happens in the body during breathwork?"
  text: |-
    Circular breathwork, a technique of fast, deep, continuous breathing, can trigger intense altered states of consciousness similar to those reported with psychedelics, but how it does this is still poorly understood. This talk presents one of the first studies to track body and mind together during a breathwork session. A decrease in carbon dioxide in the breath was linked to the onset of these states, and deeper experiences predicted better well-being and fewer depressive symptoms afterwards. The talk closes with updates on ongoing follow-up studies, including the RESET randomised controlled trial and BIOBREATH, which explores whether breathwork also affects the immune system.
